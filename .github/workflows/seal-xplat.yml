name: seal-xplat

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.25"

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        # golang.org/x/mod/zip.CreateFromDir applies the module proxy's own
        # inclusion rules, so the file set matches the published zip by
        # construction. The helper MUST live outside the repo checkout: any
        # file inside the checkout would be packaged into the zip.
        name: Build module zip
        shell: bash
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/helper" "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/helper/create_mod.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatal("usage: create_mod <module-path> <version> <source-dir> <output-zip>")
              }
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/helper"
          go mod init example.com/mod
          GOFLAGS=-mod=mod go get golang.org/x/mod@v0.24.0
          GOFLAGS=-mod=mod go run ./create_mod.go github.com/moby/buildkit v0.25.1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.25.1.zip"
          unzip -l "$RUNNER_TEMP/out/v0.25.1.zip" | head -40
      -
        name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.25.1.zip
          if-no-files-found: error

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        # worker/containerd and worker/runc TestMain panic with a nil flock in
        # RunMirror's error path unless a CNCF `registry` binary is on PATH.
        name: Install registry binary
        shell: bash
        run: |
          set -eux
          ctr=$(docker create registry:3)
          docker cp "$ctr:/bin/registry" "$RUNNER_TEMP/registry"
          docker rm "$ctr"
          sudo install -m 0755 "$RUNNER_TEMP/registry" /usr/local/bin/registry
          registry --version
      -
        # Root is required: many packages exercise mount syscalls needing
        # CAP_SYS_ADMIN. The whole unfiltered ./... runs here, no exclusions.
        name: Test
        shell: bash
        run: |
          set -eux
          sudo -E env "PATH=$PATH" go test -short ./...

  # `go test -short` above gates off every integration.Run() suite (see
  # util/testutil/integration/run.go). Those are the tests that boot a real
  # buildkitd worker and exercise the patched HTTP-source and git-source code
  # end to end, so they are run here the way upstream runs them: the
  # integration-tests image built from docker-bake.hcl, driven by ./hack/test.
  test-integration-linux:
    name: test-integration-linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            name: client
            pkgs: ./client
            testflags: "--run=//worker=oci$"
          -
            name: frontend-buildctl-solver
            pkgs: ./frontend ./cmd/buildctl ./solver
            testflags: "--run=//worker=oci$"
          -
            # ./frontend/dockerfile is the largest suite in the tree (upstream
            # shards it 12 ways); only the git/HTTP context and ADD-from-URL
            # cases reach the patched sources, so those are the ones run.
            name: dockerfile-git-http
            pkgs: ./frontend/dockerfile
            testflags: "--run=TestIntegration/(TestDockerfileFromGitSHA1|TestDockerfileFromGitSHA256|TestDockerfileFromHTTP|TestHTTPDockerfile|TestDockerfileADDFromURL|TestAddURLChmod)/worker=oci$"
    env:
      TESTFLAGS: "-v --parallel=4 --timeout=120m"
      GOTESTSUM_FORMAT: "standard-verbose"
      TEST_IMAGE_BUILD: "0"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: "edge"
          driver-opts: image=moby/buildkit:latest
          buildkitd-flags: --debug
      -
        name: Free disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      -
        name: Build test image
        uses: docker/bake-action@v6
        with:
          targets: integration-tests
          provenance: false
      -
        name: Test
        shell: bash
        run: |
          set -eux
          ./hack/test integration
        env:
          TESTPKGS: ${{ matrix.pkgs }}
          TESTFLAGS: "${{ env.TESTFLAGS }} ${{ matrix.testflags }}"

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        # TestCacheMountLockedRefs (solver/llbsolver/mounts) has cache-mount
        # unlock semantics incompatible with Windows. Nothing else is skipped.
        name: Test
        shell: bash
        run: |
          set -eux
          go test -short -skip '^TestCacheMountLockedRefs$' ./...

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false
      -
        # buildkit does not implement these five packages on darwin
        # (snapshot/localmounter_darwin.go returns "not implemented" for bind
        # mounts, and containerd has no darwin build); upstream runs ZERO macOS
        # CI. Excluded here as upstream-unimplemented darwin platform surface,
        # not as a test filter:
        #   github.com/moby/buildkit/cache
        #   github.com/moby/buildkit/cache/contenthash
        #   github.com/moby/buildkit/source/git
        #   github.com/moby/buildkit/source/http
        #   github.com/moby/buildkit/worker/containerd
        # All five DO run on the linux and windows legs, so coverage is kept.
        name: Test
        shell: bash
        run: |
          set -eux
          pkgs=$(go list ./... | grep -v -E '^github.com/moby/buildkit/(cache|cache/contenthash|source/git|source/http|worker/containerd)$')
          go test -short $pkgs
